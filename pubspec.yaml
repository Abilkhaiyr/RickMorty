name: rick_morty
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1

  # Service locator
  get_it: ^8.0.0
  # Bloc for state management
  flutter_bloc: ^9.0.0
  # Value equality
  equatable: ^2.0.1
  # Functional programming thingies
  dartz: ^0.10.1
  # Remote API
  http: ^1.2.2

  cupertino_icons: ^1.0.8
  loader_overlay: ^5.0.0
  localization: ^2.1.1
  freezed_annotation: ^3.1.0
  freezed: ^3.2.5
  bloc: ^9.2.1
  talker: ^5.1.20
  rxdart: ^0.28.0
  auto_route: 11.1.0
  fluttertoast: ^9.1.0
  shared_preferences: ^2.5.6
  pure: ^1.0.0
  dio: ^5.11.1
  build_runner: ^2.15.1
  gap: ^3.0.1
  flutter_svg: ^2.3.0
  intercepted_client: ^0.0.1
  package_info_plus: ^10.2.2
  talker_dio_logger: ^5.1.20
  json_annotation: ^4.12.0
  sentry_flutter: ^9.0.0
  cronet_http: 1.6.0
  cupertino_http: ^3.1.0
  meta: ^1.17.0
  collection: ^1.19.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  mockito: ^5.4.4

  flutter_lints: ^5.0.0
  auto_route_generator: ^10.5.0
  json_serializable: ^6.14.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2.ttf
  assets:
    - assets/icons/
    - assets/images/

flutter_gen:
  output: lib/src/core/gen
  integrations:
    flutter_svg: true
    rive: true
    lottie: true



  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
